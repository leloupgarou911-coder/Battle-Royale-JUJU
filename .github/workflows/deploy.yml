name: Deploy JUJU World to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Commit generated dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock Playwright test dependency"
            git push
          fi
      - name: Audit dependencies
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const report=require("./npm-audit.json"); console.log(JSON.stringify({summary:report.metadata?.vulnerabilities, advisories:Object.entries(report.vulnerabilities ?? {}).map(([name,item])=>({name,severity:item.severity,range:item.range,fixAvailable:item.fixAvailable}))}, null, 2))'
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run automated tests
        run: npm test
      - name: Build website
        run: npm run build
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser tests
        run: npm run test:browser
      - name: Upload browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: juju-browser-test-results
          path: test-results/
          if-no-files-found: ignore
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
